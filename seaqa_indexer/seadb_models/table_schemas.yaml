  TicketsTable:
    columns:
      title:
        column_type: text
      content:
        column_type: text
      ai_summary:
        column_type: text
      ai_processed_time:
        column_type: datetime
      ai_summary_vector:
        column_type: list
        column_data:
          list_type: float32
      state:
        column_type: single-select
        column_data:
          options:
          - id: '0001'
            name: open
            color: '#1A7F37'
            text_color: '#FFFFFF'
          - id: '0002'
            name: closed
            color: '#8250DF'
            text_color: '#FFFFFF'
      substate:
        column_type: single-select
        column_data:
          cascade_source_column: state
          cascade_settings:
            '0001':
            - '0010'
            - '0011'
            - '0012'
            - '0013'
            '0002':
            - '0014'
            - '0015'
            - '0016'
          options:
          - id: '0010'
            name: New
            color: '#59CB74'
            text_color: '#FFFFFF'
          - id: '0011'
            name: Working on
            color: '#46A1FD'
            text_color: '#FFFFFF'
          - id: '0012'
            name: Backlog
            color: '#9C9C9E'
            text_color: '#FFFFFF'
          - id: '0013'
            name: Waiting on user
            color: '#EAA775'
            text_color: '#FFFFFF'
          - id: '0014'
            name: Completed
            color: '#8250DF'
            text_color: '#FFFFFF'
          - id: '0015'
            name: Not planned
            color: '#59636E'
            text_color: '#FFFFFF'
          - id: '0016'
            name: Duplicate
            color: '#59636E'
            text_color: '#FFFFFF'
      type:
        column_type: single-select
        column_data:
          options:
          - id: '0001'
            name: Bug
            color: '#ffebe9'
            text_color: '#000000'
          - id: '0002'
            name: Feature
            color: '#ddf4ff'
            text_color: '#000000'
          - id: '0003'
            name: Question
            color: '#fff8c5'
            text_color: '#000000'
      tags:
        column_type: list
        column_data:
          list_type: int64
      assignees:
        column_type: list
      participants:
        column_type: list
      linked_connection_records:
        column_type: list
      priority:
        column_type: int64
      creator:
        column_type: text
      comment_count:
        column_type: int64
      created_time:
        column_type: datetime
      modified_time:
        column_type: datetime
      closed_time:
        column_type: datetime
      deleted:
        column_type: bool
      due_date:
        column_type: datetime
      last_agent_processed_at:
        column_type: datetime
    indexes:
    - - priority
    - - state
    - - substate
    - - type
    - - assignees
    - - participants
    - - creator
    - - deleted
    - - due_date
    - - ai_processed_time
    - - modified_time
