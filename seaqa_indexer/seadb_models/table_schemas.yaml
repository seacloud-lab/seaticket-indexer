tables:
  WebCrawlTable:
    columns:
      url:
        column_type: text
      title:
        column_type: text
      etag:
        column_type: text
      modified_time:
        column_type: datetime
      sync_time:
        column_type: datetime
      deleted:
        column_type: bool
      outdated:
        column_type: bool
      record_modified_time:
        column_type: datetime
      hash:
        column_type: text
      ai_summary:
        column_type: text
      ai_processed_time:
        column_type: datetime
      ai_summary_vector:
        column_type: list
        column_data:
          list_type: float32
    indexes:
    - - url
    - - modified_time
    - - deleted
    - - ai_processed_time
    - - record_modified_time
    table_name: site_{connection_id}
  GithubIssuesTable:
    columns:
      issue_id:
        column_type: int64
      issue_number:
        column_type: int64
      title:
        column_type: text
      ai_title:
        column_type: text
      content:
        column_type: text
        column_data:
          compressed: true
      state:
        column_type: single-select
        column_data:
          options:
          - id: '0001'
            name: open
            color: '#1A7F37'
            text_color: '#FFFFFF'
          - id: '0002'
            name: closed
            color: '#8250DF'
            text_color: '#FFFFFF'
      state_reason:
        column_type: single-select
        column_data:
          options:
          - id: '0001'
            name: completed
            color: '#8250DF'
            text_color: '#FFFFFF'
          - id: '0002'
            name: not_planned
            color: '#59636E'
            text_color: '#FFFFFF'
          - id: '0003'
            name: duplicate
            color: '#59636E'
            text_color: '#FFFFFF'
          - id: '0004'
            name: reopened
            color: '#1A7F37'
            text_color: '#FFFFFF'
      labels:
        column_type: multiple-select
      issue_type:
        column_type: single-select
      author:
        column_type: text
      assignees:
        column_type: text
      url:
        column_type: text
      created_time:
        column_type: datetime
      modified_time:
        column_type: datetime
      sync_time:
        column_type: datetime
      closed_time:
        column_type: datetime
      comment_count:
        column_type: int64
      deleted:
        column_type: bool
      outdated:
        column_type: bool
      record_modified_time:
        column_type: datetime
      ai_summary:
        column_type: text
      ai_processed_time:
        column_type: datetime
      ai_summary_vector:
        column_type: list
        column_data:
          list_type: float32
      linked_ticket:
        column_type: int64
    indexes:
    - - issue_id
    - - state
    - - state_reason
    - - labels
    - - title
    - - author
    - - created_time
    - - closed_time
    - - deleted
    - - linked_ticket
    - - ai_processed_time
    - - record_modified_time
    table_name: github_issue_{connection_id}
  GithubIssueCommentsTable:
    columns:
      comment_id:
        column_type: int64
      issue_id:
        column_type: int64
      author:
        column_type: text
      content:
        column_type: text
        column_data:
          compressed: true
      created_time:
        column_type: datetime
      modified_time:
        column_type: datetime
    indexes:
    - - issue_id
    - - comment_id
    table_name: github_issue_comments_{connection_id}
  DiscourseTopicsTable:
